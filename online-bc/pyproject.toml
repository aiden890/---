[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocasa-online-bc"
version = "0.1.0"
description = "Success-filtered online behavior cloning for RoboCasa"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["online_bc*"]

[tool.setuptools.package-data]
"online_bc._vendor" = ["RLinf-LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/online_bc/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.optional-dependencies]
dev = ["ruff>=0.15,<0.16"]
