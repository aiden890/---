# Hydra config: tiny adapter-only PPO SMOKE. Correctness probe, NOT a training run.
# One short PPO update to verify data flow end-to-end. Long training stays disabled.
defaults:
  - _self_

run_kind: ppo_smoke
results_dir: /results/ppo_smoke

model:
  checkpoint_dir: /checkpoint
  device: cuda
  dtype: bfloat16
  num_steps: 5
  replan_steps: 16
  active_action_dim: 12
  train_mode: adapter_only        # freeze VLM + action-expert body; adapters + term head only

env:
  task_name: CloseBlenderLid
  robots: PandaOmron
  skill: GRASP_OBJECT
  horizon: 400
  use_milestones: false           # pay-once-at-end payout

sampler:
  name: pirl_flow_sde
  noise_level: 0.3                # eta>0 for RL rollouts (log-probs)

ppo:
  algo: ppo                       # PPO first as the correctness baseline; GRPO only after
  group_size: 4
  num_iterations: 1               # SMOKE: exactly one short update
  update_epochs: 2                # >=2 so the importance ratio/clip actually engages
  optimizer: sgd                  # feasibility: AdamW OOMs beside a loaded model; SGD fits
  grad_checkpoint: true
  lr: 1.0e-4
  clip: 0.2
  kl_coef: 0.0

# Hard guard: anything above these caps is a real training run and is disabled here.
guards:
  max_iterations: 1
  training_enabled: false
